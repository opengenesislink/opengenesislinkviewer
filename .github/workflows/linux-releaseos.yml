# Manual native compilation only; no release, signing, or deployment.
# Requires a trusted, isolated Ubuntu 22.04 x86_64 runner with label
# 'ogl-native-linux', >=16 GB RAM, >=64 GB free disk, GCC/G++ 11.
# workflow_dispatch becomes available in GitHub UI after this workflow
# exists on the repository's default branch.
name: OpenGenesisLINK Linux ReleaseOS (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogl-native-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  releaseos:
    name: Compile Linux x64 OpenSimulator viewer
    runs-on: [self-hosted, linux, x64, ogl-native-linux]
    timeout-minutes: 240
    steps:
      - name: Checkout OpenGenesisLINK source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned Firestorm build variables
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FirestormViewer/fs-build-variables
          ref: c17312d38377c003977cf5b6dcc83c6042eba194
          path: fs-build-variables
          persist-credentials: false

      - name: Verify dedicated Linux build environment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preflight_linux.sh
          python3 scripts/check_source_import.py

      - name: Install Python Autobuild tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ogl-native-venv"
          "$RUNNER_TEMP/ogl-native-venv/bin/python" -m pip install -r requirements.txt

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ogl-ci-output
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_sha=$GITHUB_SHA"
            echo "build_variables_sha=c17312d38377c003977cf5b6dcc83c6042eba194"
            echo "build_variant=ReleaseOS"
            echo "runner=$(uname -srm)"
            gcc-11 --version | head -n 1
            cmake --version | head -n 1
            "$RUNNER_TEMP/ogl-native-venv/bin/autobuild" --version
          } > ogl-ci-output/build-metadata.txt

      - name: Configure and compile viewer (no publishing)
        shell: bash
        env:
          CC: gcc-11
          CXX: g++-11
          AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/fs-build-variables/variables
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ogl-native-venv/bin:$PATH"
          bash scripts/build_linux.sh 2>&1 | tee ogl-ci-output/build.log

      - name: Check compiled OpenSimulator ELF and linkage (not grid login)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_linux_binary.sh 2>&1 | tee ogl-ci-output/binary-smoke.log

      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ogl-linux-releaseos-logs-${{ github.run_id }}
          path: ogl-ci-output/
          if-no-files-found: warn
          retention-days: 7
